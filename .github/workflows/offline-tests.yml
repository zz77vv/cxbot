name: Offline business tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: >-
          python -m pytest -q
          --ignore=tests/unit/test_ocr_preprocessing.py
          --ignore=tests/unit/test_verification_service.py
          -k "not test_ocr_image_mock_and_legacy_adapter"
